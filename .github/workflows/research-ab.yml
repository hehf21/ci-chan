name: research-ab

# 团队研究专用：信号生成 + GG 中枢序列生成 + A0/A1/ZG 对照回测，全在 Actions 算。
# 2026-10-30 修订：calc 两步允许失败（continue-on-error）并上传日志；
#                ab 用 always() 跑，且可用 extra_run_id 复用上一次 run 的 part-* 工件。
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "信号口径：ep0=仅修断流 / ep1=再加笔端点须为区间极值"
        required: true
        default: ep1
        type: choice
        options: [ep0, ep1]
      codes:
        description: "只跑这些票（逗号分隔，留空=仓库 data/min30 里的全部）"
        required: false
        default: ""
        type: string
      step:
        description: "中枢序列采样间隔（根）；4=每 2 小时一次"
        required: false
        default: "4"
        type: string
      limit:
        description: "最多跑多少只（0=不限，调试用 20 省额度）"
        required: false
        default: "0"
        type: string
      extra_run_id:
        description: "额外复用哪个 run 的 part-* 工件（补跑分支用，留空=不用）"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          set -e
          if [ -n "${{ inputs.codes }}" ]; then
            CODES="${{ inputs.codes }}"
          else
            CODES=$(ls data/min30 | sed 's/\.csv\.gz$//' | paste -sd, -)
          fi
          if [ "${{ inputs.limit }}" != "0" ]; then
            CODES=$(python3 -c "import sys;c=[x for x in sys.argv[1].split(',') if x][:${{ inputs.limit }}];print(','.join(c))" "$CODES")
          fi
          echo "codes=$CODES"
          echo "matrix=$(python3 -c "import json,sys;print(json.dumps([c for c in sys.argv[1].split(',') if c]))" "$CODES")" >> "$GITHUB_OUTPUT"

  calc:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        code: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt baostock
      - name: 信号（${{ inputs.variant }}）
        shell: bash
        run: |
          set -o pipefail
          python ci/run_stock.py --code ${{ matrix.code }} --variant ${{ inputs.variant }} 2>&1 | tee "log_${{ matrix.code }}.txt"
        continue-on-error: true
      - name: GG/DD 中枢序列
        shell: bash
        run: |
          set -o pipefail
          python ci/zs_stock.py --code ${{ matrix.code }} --step ${{ inputs.step }} --outdir zs_parts 2>&1 | tee -a "log_${{ matrix.code }}.txt"
        continue-on-error: true
      - name: 上传分片与日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.code }}
          path: |
            signals_parts/
            zs_parts/
            data/min30/${{ matrix.code }}.csv.gz
            log_${{ matrix.code }}.txt
          if-no-files-found: warn

  ab:
    needs: calc
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt baostock
      - name: 下载本次分片
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: .
      - name: 复用上一次 run 的分片
        if: inputs.extra_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: .
          run-id: ${{ inputs.extra_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 合并输入
        run: python ci/merge_inputs.py --variant ${{ inputs.variant }}
      - name: A0 / A1 / ZG 对照
        run: |
          python ci/bt_gg.py --signals out/signals_merged.csv --zs out/zs_series_gg.csv \
            --arm both --dedupe rule40 --out ${{ inputs.variant }}_A0A1
          python ci/bt_gg.py --signals out/signals_merged.csv --zs out/zs_series_gg.csv \
            --arm ZG --dedupe rule40 --out ${{ inputs.variant }}_ZG
      - name: 汇总
        run: |
          python3 - <<'PY'
          import glob, json, os
          rows = {}
          for p in sorted(glob.glob("ci/res_*.json")):
              d = json.load(open(p, encoding="utf-8"))
              rows[os.path.basename(p)] = {
                  "n_signals_used": d.get("n_signals_used"),
                  "codes": len(d.get("codes") or []),
                  "arms": {k: {"stats": v.get("stats"), "split": v.get("split"),
                               "gg_hits": v.get("gg_hits")} for k, v in (d.get("arms") or {}).items()},
              }
          os.makedirs("out", exist_ok=True)
          json.dump(rows, open("out/ab_summary.json", "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ab-result-${{ inputs.variant }}
          path: |
            out/ab_summary.json
            ci/res_*.json
            ci/trades_*.csv
            log_*.txt
          if-no-files-found: warn
