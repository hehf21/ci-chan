name: pvfactor

# 价量因子截面选股：动量/反转/波动/换手/量能
# plan 出股票池 → calc 每票算因子（矩阵并行）→ analyze 月度调仓回测 + 因子 IC

on:
  workflow_dispatch:
    inputs:
      n:
        description: "抽多少只票"
        required: false
        default: "300"
        type: string
      seed:
        description: "随机抽样种子（换种子=换股票池，用于复现性检验）"
        required: false
        default: "20261030"
        type: string
      top:
        description: "每月买入前多少只"
        required: false
        default: "30"
        type: string
      start:
        description: "取数起点"
        required: false
        default: "2017-01-01"
        type: string
      end:
        description: "取数终点"
        required: false
        default: "2026-10-30"
        type: string
      sign_mode:
        description: "因子方向：prior=先验 / ic=用样本内IC定符号再做样本外"
        required: false
        default: "ic"
        type: string
      is_months:
        description: "定符号用的样本内月数（ic 模式）"
        required: false
        default: "36"
        type: string
      factors:
        description: "只用这些因子（空=全部），如 f_mom60,f_mom20,f_rev5"
        required: false
        default: ""
        type: string
      capital:
        description: "初始资金（元）；>0 会输出逐笔调仓明细"
        required: false
        default: "0"
        type: string
      timing:
        description: "择时：none / bench_ma（基准趋势向下空仓）/ strat_ma（策略自身向下空仓）"
        required: false
        default: "none"
        type: string
      timing_win:
        description: "择时回看月数"
        required: false
        default: "3"
        type: string
      neutralize:
        description: "风格中性化：按该因子五分组内排序（如 f_amt20），空=不中性化"
        required: false
        default: ""
        type: string
      cost_bps:
        description: "每月调仓双边成本（基点，15=0.15%）"
        required: false
        default: "15"
        type: string
      bt_start:
        description: "回测起点"
        required: false
        default: "2020-01-01"
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt baostock
      - id: m
        run: |
          set -e
          CODES=$(python ci/universe.py --all --n ${{ inputs.n }} --seed ${{ inputs.seed }})
          echo "count=$(echo "$CODES" | tr ',' '\n' | wc -l)"
          echo "matrix=$(python3 -c "import json,sys;print(json.dumps([c for c in sys.argv[1].split(',') if c]))" "$CODES")" >> "$GITHUB_OUTPUT"

  calc:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        code: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt baostock
      - name: 因子（${{ matrix.code }}）
        run: |
          python ci/pv_one.py --code ${{ matrix.code }} --start ${{ inputs.start }} \
            --end ${{ inputs.end }} --outdir pv_parts || true
      - uses: actions/upload-artifact@v4
        with:
          name: pv-${{ matrix.code }}
          path: pv_parts/${{ matrix.code }}.csv
          if-no-files-found: ignore

  analyze:
    needs: calc
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt baostock
      - uses: actions/download-artifact@v4
        with:
          pattern: pv-*
          merge-multiple: true
          path: pv_parts
      - name: 截面回测
        run: |
          python ci/pv_merge.py --top ${{ inputs.top }} --bt-start ${{ inputs.bt_start }} \
            --end ${{ inputs.end }} --sign-mode ${{ inputs.sign_mode }} --is-months ${{ inputs.is_months }} \
            --factors "${{ inputs.factors }}" --cost-bps ${{ inputs.cost_bps }} \
            --neutralize "${{ inputs.neutralize }}" \
            --timing ${{ inputs.timing }} --timing-win ${{ inputs.timing_win }} \
            --capital ${{ inputs.capital }}
      - uses: actions/upload-artifact@v4
        with:
          name: pv-result
          path: |
            out/pv_*.json
            out/pv_trades.csv
          if-no-files-found: error
