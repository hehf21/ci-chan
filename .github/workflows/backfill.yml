name: backfill

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "口径：ep0=仅修断流 / ep1=再加笔端点须为区间极值"
        required: true
        default: ep1
        type: choice
        options: [ep0, ep1]
      universe:
        description: "股票池：repo=仓库里已有的数据 / hs300=现取沪深300前N只"
        required: true
        default: repo
        type: choice
        options: [repo, hs300]
      n:
        description: "hs300 模式取前多少只"
        required: false
        default: "100"
        type: string
      codes:
        description: "只跑这些票（逗号分隔，优先级最高）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt baostock
      - id: m
        run: |
          set -e
          if [ -n "${{ inputs.codes }}" ]; then
            CODES="${{ inputs.codes }}"
          elif [ "${{ inputs.universe }}" = "hs300" ]; then
            CODES=$(python ci/universe.py --n ${{ inputs.n }})
          else
            CODES=$(ls data/min30 | sed 's/\.csv\.gz$//' | paste -sd, -)
          fi
          echo "codes=$CODES"
          JSON=$(python3 -c "import json,sys;print(json.dumps([c for c in sys.argv[1].split(',') if c]))" "$CODES")
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  gen:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        code: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt baostock
      - name: 生成信号（缺数据时现场取）
        run: python ci/run_stock.py --code ${{ matrix.code }} --variant ${{ inputs.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: sig-${{ inputs.variant }}-${{ matrix.code }}
          path: signals_parts/
          if-no-files-found: error

  merge:
    needs: gen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt baostock
      - uses: actions/download-artifact@v4
        with:
          pattern: sig-${{ inputs.variant }}-*
          merge-multiple: true
          path: signals_parts
      - name: 合并 + 回测
        run: python ci/merge_and_bt.py --variant ${{ inputs.variant }}
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ inputs.variant }}
          path: |
            out/ci_*.json
            out/ci_*_equity.csv
            out/ci_*_trades.csv
            out/ci_*_roundtrips.csv
