name: backfill

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "口径：ep0=仅修断流 / ep1=再加笔端点须为区间极值"
        required: true
        default: ep1
        type: choice
        options: [ep0, ep1]
      universe:
        description: "股票池：repo=仓库里已有的数据 / hs300=现取沪深300前N只"
        required: true
        default: repo
        type: choice
        options: [repo, hs300, all]
      n:
        description: "hs300 模式取前多少只"
        required: false
        default: "100"
        type: string
      codes:
        description: "只跑这些票（逗号分隔，优先级最高）"
        required: false
        default: ""
        type: string
      step:
        description: "扫描步长（30分钟=1，日线建议5）"
        required: false
        default: "1"
        type: string
      freq:
        description: "周期：30=30分钟 / d=日线"
        required: false
        default: "30"
        type: string
      start:
        description: "信号取数起点"
        required: false
        default: "2020-01-01"
        type: string
      end:
        description: "信号取数终点"
        required: false
        default: "2026-10-29"
        type: string
      trade_start:
        description: "组合回测起始（资金曲线从这天开始）"
        required: false
        default: "2020-07-01"
        type: string
      window:
        description: "结构分析窗口（根）"
        required: false
        default: "3000"
        type: string
      max_positions:
        description: "同时持仓上限"
        required: false
        default: "3"
        type: string
      max_weight:
        description: "单票权重上限（0.3=30%）"
        required: false
        default: "0.30"
        type: string
      require_vol_ratio:
        description: "第7/8课量能突破：买点要求量比 >= 该值（0=关）"
        required: false
        default: "0"
        type: string
      require_daily_up:
        description: "区间套：1=只在日线向上时发买点（0=关）"
        required: false
        default: "0"
        type: string
      require_above_ma:
        description: "第8课能搞：站上 N 日线才发买点（0=关，250=年线）"
        required: false
        default: "0"
        type: string
      only_first_zs:
        description: "第79课：只做第一个中枢的三买（true/false）"
        required: false
        default: "false"
        type: string
      kinds:
        description: "只留这些点类型，如 B3,S1,S2,S3（空=全部）"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt baostock
      - id: m
        run: |
          set -e
          if [ -n "${{ inputs.codes }}" ]; then
            CODES="${{ inputs.codes }}"
          elif [ "${{ inputs.universe }}" = "hs300" ]; then
            CODES=$(python ci/universe.py --n ${{ inputs.n }})
          elif [ "${{ inputs.universe }}" = "all" ]; then
            CODES=$(python ci/universe.py --all --n ${{ inputs.n }})
          else
            CODES=$(ls data/min30 | sed 's/\.csv\.gz$//' | paste -sd, -)
          fi
          echo "codes=$CODES"
          JSON=$(python3 -c "import json,sys;print(json.dumps([c for c in sys.argv[1].split(',') if c]))" "$CODES")
          echo "matrix=$JSON" >> "$GITHUB_OUTPUT"

  gen:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        code: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt baostock
      - name: 生成信号（缺数据时现场取）
        run: python ci/run_stock.py --code ${{ matrix.code }} --variant ${{ inputs.variant }} --start ${{ inputs.start }} --end ${{ inputs.end }} --window ${{ inputs.window }} --freq ${{ inputs.freq }} --step ${{ inputs.step }} --require-daily-up ${{ inputs.require_daily_up }} --require-vol-ratio ${{ inputs.require_vol_ratio }} --require-above-ma ${{ inputs.require_above_ma }}
      - uses: actions/upload-artifact@v4
        with:
          name: sig-${{ inputs.variant }}-${{ matrix.code }}
          path: signals_parts/
          if-no-files-found: error
      # 顺手把本次取到的行情也传上去：否则 merge 阶段会把缺数据的票重新拉一遍。
      # 2026-10-30 实测：100 票的 merge 卡在逐票 baostock 取数上，30 分钟还没走完。
      - uses: actions/upload-artifact@v4
        with:
          name: data-${{ matrix.code }}
          path: data/**/${{ matrix.code }}.csv.gz
          if-no-files-found: ignore

  merge:
    needs: gen
    # 个别票取数失败不该让整轮没有结果：always() 让 merge 照常跑，
    # artifact 只拉成功的那部分（2026-10-30 实测 4 只票失败导致 merge 被 skip）。
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt baostock
      - uses: actions/download-artifact@v4
        with:
          pattern: data-*
          merge-multiple: true
          path: data/min30
      - uses: actions/download-artifact@v4
        with:
          pattern: sig-${{ inputs.variant }}-*
          merge-multiple: true
          path: signals_parts
      - name: 合并 + 回测
        run: python ci/merge_and_bt.py --variant ${{ inputs.variant }} --start ${{ inputs.start }} --end ${{ inputs.end }} --trade-start ${{ inputs.trade_start }} --freq ${{ inputs.freq }} --max-positions ${{ inputs.max_positions }} --max-weight ${{ inputs.max_weight }} ${{ inputs.only_first_zs == 'true' && '--only-first-zs' || '' }} --kinds "${{ inputs.kinds }}"
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ inputs.variant }}-mp${{ inputs.max_positions }}-zs${{ inputs.only_first_zs }}-ma${{ inputs.require_above_ma }}-nest${{ inputs.require_daily_up }}-${{ inputs.kinds }}
          path: |
            out/ci_*.json
            out/ci_*_equity.csv
            out/ci_*_trades.csv
            out/ci_*_roundtrips.csv
